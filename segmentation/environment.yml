name: vlm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- 核心框架和CUDA ---
  - python=3.10
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=11.8

  # --- 数据处理和工具 ---
  - numpy=1.26
  - pandas
  - pillow
  - tqdm
  - scikit-image  # data_loader 中可能需要的图像处理库

  # --- Pip 安装的包 ---
  - pip
  - pip:
    - open_clip_torch